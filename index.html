<body class="m-0 p-0 overflow-x-hidden select-none">
  
  <!-- Contenedor principal de React -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BRAILLE_ALPHABET = {
      a: [1], b: [1, 2], c: [1, 4], d: [1, 4, 5], e: [1, 5],
      f: [1, 2, 4], g: [1, 2, 4, 5], h: [1, 2, 5], i: [2, 4], j: [2, 4, 5],
      k: [1, 3], l: [1, 2, 3], m: [1, 3, 4], n: [1, 3, 4, 5], o: [1, 3, 5],
      p: [1, 2, 3, 4], q: [1, 2, 3, 4, 5], r: [1, 2, 3, 5], s: [2, 3, 4], t: [2, 3, 4, 5],
      u: [1, 3, 6], v: [1, 2, 3, 6], w: [2, 4, 5, 6], x: [1, 3, 4, 6], y: [1, 3, 4, 5, 6], z: [1, 3, 5, 6]
    };

    const INITIAL_STORIES = [
      {
        id: 1,
        title: "El Concierto del Bosque",
        summary: "Acompaña a Mateo a descubrir que los árboles y el viento tocan la melodía más hermosa del mundo.",
        content: "Mateo cerró los ojos y respiró hondo. El aire olía a tierra mojada y a pino fresco. A su alrededor, el bosque no estaba en silencio; estaba lleno de música. Bajo sus pies, las hojas secas crujían suavemente con un sonido rítmico, como maracas de la naturaleza. De repente, un silbido suave recorrió las copas de los árboles: era el viento jugando a ser un flautista.\n\nMateo extendió sus manos y tocó la corteza de un viejo roble; era áspera, rugosa y cálida, llena de surcos que contaban historias de cien años. En ese momento, un coro de pájaros comenzó a cantar desde lo alto.\n\nMateo sonrió, entendiendo que no necesitaba ver el bosque para sentir su maravilloso concierto.",
        sensoryFocus: "Oído y Tacto"
      },
      {
        id: 2,
        title: "El Aroma Perdido",
        summary: "La perrita guía Luna ayuda a resolver el misterio de las flores de vainilla en el jardín.",
        content: "Luna, la labradora de pelaje suave como el algodón, dio tres golpecitos con su nariz húmeda en la mano de Sofía. Era la señal para iniciar la aventura matutina. Hoy el jardín olía diferente. Caminaron sobre el sendero de piedras redondas y lisas que se sentían frescas bajo los pies descalzos.\n\nAl acercarse a las flores, un aroma dulce, cálido y reconfortante inundó el aire: ¡era vainilla! Sofía extendió sus dedos y acarició los pétalos aterciopelados de una gran flor. Al tocarlos, un polvillo fino y aromático quedó en sus dedos, oliendo a galletas recién horneadas.\n\nLuna soltó un alegre ladrido y movió la cola rítmicamente contra el pasto mullido. Juntas habían descubierto que la felicidad tiene aroma a vainilla y textura de pétalo.",
        sensoryFocus: "Olfato y Tacto"
      },
      {
        id: 3,
        title: "Estrellas de Mar",
        summary: "Una aventura a la orilla del océano sintiendo la arena tibia, la brisa salada y el vaivén de las olas.",
        content: "El sonido del mar era un susurro constante que iba y venía: 'Shhh... shhh...'. Cada ola que llegaba a la orilla dejaba una espuma fresca que hacía cosquillas en los tobillos de Tomás. La arena bajo sus pies estaba tibia por el sol del mediodía y se escurría suavemente entre sus dedos como agua seca.\n\nTomás se agachó y enterró las manos. Encontró algo pequeño, liso y con forma de estrella. Tenía una textura ligeramente rugosa en los bordes pero un centro suave.\n\nAl acercarla a su oído, no solo escuchó el viento marino, sino que sintió la brisa salada acariciándole la cara. El océano entero estaba hablándole con su voz de espuma y caricias de arena.",
        sensoryFocus: "Tacto y Sonido"
      },
      {
        id: 4,
        title: "El Panadero del Alba",
        summary: "Descubre la magia de la panadería con el calor del horno y el aroma a canela y masa fresca.",
        content: "Muy temprano por la mañana, cuando la brisa aún es fresca y silenciosa, Andrés acompaña a su abuelo a la panadería. Al cruzar la puerta, un choque de aire tibio y dulce lo abraza de inmediato. El lugar huele a vainilla, canela y mantequilla derretida.\n\nAndrés mete las manos en un tazón lleno de harina: se siente esponjosa, suave y liviana como nieve tibia. Luego ayuda a amasar. La masa es elástica, suave y cobra vida bajo la presión rítmica de sus palmas.\n\nCuando el pan sale del horno, el chasquido de la corteza crujiente suena como pequeños aplausos. Al darle un mordisco, el calor reconfortante llena todo su ser.",
        sensoryFocus: "Olfato, Tacto y Gusto"
      },
      {
        id: 5,
        title: "La Sinfonía de la Lluvia",
        summary: "Un viaje sonoro y táctil escuchando el repiqueteo de las gotas de agua y sintiendo la brisa húmeda.",
        content: "Valentina se sentó cerca de la ventana abierta cuando comenzó a llover. Las primeras gotas cayeron sobre las hojas del jardín con un golpeteo seco y rápido: 'Tap, tap, tap'. Poco a poco, el ritmo se volvió más denso y continuo, creando una melodía envolvente.\n\nValentina sacó la mano por la ventana. Sintió el impacto diminuto y fresco de las gotas contra la palma de su mano, seguido por el recorrido suave del agua deslizándose entre sus dedos. El aire se llenó de un perfume único y limpio: el aroma a petricor, la tierra mojada despertando.\n\nCerró los ojos y respiró hondo, escuchando cómo el tejado de tejas de barro resonaba como un gran tambor afinado por la naturaleza.",
        sensoryFocus: "Oído y Tacto"
      },
      {
        id: 6,
        title: "El Abrazo de la Lana Mágica",
        summary: "La abuela Elena le enseña a Lucas a tejer recuerdos suaves y cálidos.",
        content: "Lucas adora pasar las tardes de invierno junto a la abuela Elena. Ella le pasa una bola de lana suave y esponjosa. Al deslizar la lana por entre sus dedos, Lucas siente pequeñas ondas y texturas afelpadas que le transmiten una calidez inmediata.\n\nMientras la abuela teje, las agujas de madera chocan entre sí con un 'clic, clic, clic' rítmico y pacífico, como el tic-tac de un reloj cariñoso. La manta que crece sobre sus piernas es pesada, abrigada y huele a jabón de lavanda.\n\nCada punto tejía no solo hilo, sino también historias de abrazos y tardes felices compartidas en familia.",
        sensoryFocus: "Tacto y Sonido"
      },
      {
        id: 7,
        title: "El Viaje del Viento de Otoño",
        summary: "Acompaña a Camilo a seguir las crujientes alfombras de hojas y la brisa juguetona.",
        content: "Otoño ha llegado al parque y Camilo lo sabe antes que nadie. Con cada paso que da, escucha un crujido seco y crujiente bajo sus botas: 'Craj, craj, craj'. Es la alfombra de hojas secas que cubre todo el suelo.\n\nCamilo se agacha y junta un puñado de hojas. Siente sus bordes quebradizos, sus vetas marcadas como pequeñas redes e hilos, e imagina sus colores tostados. Lanza las hojas al aire y un soplido de viento helado y juguetón se las lleva, haciéndolas revolotear a su alrededor.\n\nEl viento le acaricia las mejillas y le despeina el cabello, invitándolo a seguir caminando por el parque cantarín.",
        sensoryFocus: "Oído y Tacto"
      }
    ];

    const playTone = (frequency, duration = 0.2, type = 'sine') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const audioCtx = new AudioCtx();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        
        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log("Audio no iniciado o bloqueado.");
      }
    };

    function Icon({ name, size = 18, className = "" }) {
      const icons = {
        Volume1: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>,
        Volume2: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
        VolumeX: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>,
        BookOpen: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
        Sparkles: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path></svg>,
        Play: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
        Pause: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
        RotateCcw: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0-.57-8.38l5.67-5.67"></path></svg>,
        ArrowLeft: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
        Eye: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
        EyeOff: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>,
        Search: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
        Plus: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
        List: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
        Home: <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      };
      return icons[name] || null;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [voiceOverEnabled, setVoiceOverEnabled] = useState(true);
      const [highContrast, setHighContrast] = useState(false);
      const [speechRate, setSpeechRate] = useState(1);
      const [stories, setStories] = useState(INITIAL_STORIES);

      const speak = (text) => {
        if (!voiceOverEnabled) return;
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-MX';
            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
          }
        } catch (e) {
          console.error("Error en la síntesis de voz:", e);
        }
      };

      useEffect(() => {
        speak("Bienvenido a Braille Voz. Cuentos que se escuchan e historias que se sienten.");
      }, []);

      const menuItems = [
        { id: 'home', label: 'Inicio', icon: <Icon name="Home" size={18} /> },
        { id: 'braille', label: 'Abecedario', icon: <Icon name="BookOpen" size={18} /> },
        { id: 'cuentos', label: 'Cuentos', icon: <Icon name="Sparkles" size={18} /> }
      ];

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-300 pb-20 md:pb-0 ${
          highContrast ? 'bg-black text-yellow-300' : 'bg-[#E6D8CB] text-[#2F3559]'
        }`}>
          
          {/* HEADER */}
          <header className={`border-b shadow-md transition-colors ${
            highContrast ? 'bg-zinc-900 border-yellow-300 text-yellow-300' : 'bg-[#2F3559] text-[#E6D8CB] border-[#9A5071]/20'
          }`}>
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
              
              {/* Logo / Title */}
              <div 
                className="flex items-center gap-3 cursor-pointer select-none group"
                onClick={() => { setActiveTab('home'); speak("Volver al Inicio"); }}
              >
                {/* ESPACIO PARA TU LOGOTIPO */}
                <div className={`w-11 h-11 md:w-12 md:h-12 rounded-xl flex items-center justify-center border overflow-hidden shadow-sm transition-transform group-hover:scale-105 ${
                  highContrast ? 'bg-zinc-800 border-yellow-300' : 'bg-[#9A5071]/30 border-[#F1BBBB]/40'
                }`}>
                  {/* 
                    CAMBIA 'logotipo.jpg' POR EL NOMBRE O RUTA DE TU IMAGEN
                    Ejemplo: src="logotipo de braille voz.jpeg" o src="assets/logo.png"
                  */}
                  <img 
                    src="logotipo.jpg" 
                    alt="Logo Braille Voz" 
                    className="w-full h-full object-cover"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                    }}
                  />
                  {/* Marcador de posición visual si no existe aún la imagen */}
                  <div className="hidden w-full h-full items-center justify-center text-xl font-bold">
                    🐕
                  </div>
                </div>

                <div>
                  <h1 className="text-lg md:text-xl font-black leading-none flex gap-1">
                    <span>braille</span>
                    <span className={highContrast ? 'text-white' : 'text-[#F1BBBB]'}>voz</span>
                  </h1>
                  <p className="hidden sm:block text-[10px] opacity-80 italic font-medium mt-0.5">
                    Cuentos que se escuchan, historias que se sienten
                  </p>
                </div>
              </div>

              {/* Controles de accesibilidad rápidas */}
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => {
                    const newVal = !voiceOverEnabled;
                    setVoiceOverEnabled(newVal);
                    if (newVal) {
                      setTimeout(() => speak("Voz de lectura activada."), 100);
                    } else if ('speechSynthesis' in window) {
                      window.speechSynthesis.cancel();
                    }
                  }}
                  className={`p-2.5 rounded-full transition-all ${
                    voiceOverEnabled 
                      ? (highContrast ? 'bg-yellow-300 text-black' : 'bg-[#9A5071] text-white shadow-sm') 
                      : (highContrast ? 'bg-zinc-800 text-yellow-300/50' : 'bg-black/10 text-[#E6D8CB]')
                  }`}
                  title={voiceOverEnabled ? "Desactivar audio lectura" : "Activar audio lectura"}
                >
                  {voiceOverEnabled ? <Icon name="Volume2" size={18} /> : <Icon name="VolumeX" size={18} />}
                </button>

                {voiceOverEnabled && (
                  <button 
                    onClick={() => {
                      const rates = [1, 1.3, 0.8];
                      const nextRate = rates[(rates.indexOf(speechRate) + 1) % rates.length];
                      setSpeechRate(nextRate);
                      speak(nextRate === 1 ? "Velocidad normal." : nextRate === 1.3 ? "Velocidad rápida." : "Velocidad lenta.");
                    }}
                    className={`text-[11px] font-bold px-3 py-2 rounded-full border transition-all ${
                      highContrast 
                        ? 'bg-zinc-800 border-yellow-300/40 text-yellow-300 hover:bg-zinc-700' 
                        : 'bg-black/20 border-white/20 text-[#E6D8CB] hover:bg-black/30'
                    }`}
                  >
                    {speechRate === 1 ? '1.0x' : speechRate === 1.3 ? '1.3x' : '0.8x'}
                  </button>
                )}

                <button 
                  onClick={() => {
                    const nextVal = !highContrast;
                    setHighContrast(nextVal);
                    speak(nextVal ? "Modo alto contraste activado." : "Modo vista normal activado.");
                  }}
                  className={`p-2.5 rounded-full transition-all ${
                    highContrast 
                      ? 'bg-yellow-300 text-black' 
                      : 'bg-white/10 text-[#E6D8CB] hover:bg-white/20'
                  }`}
                  title="Cambiar contraste"
                >
                  {highContrast ? <Icon name="Eye" size={18} /> : <Icon name="EyeOff" size={18} />}
                </button>
              </div>

            </div>
          </header>

          {/* MENÚ DE NAVEGACIÓN DESKTOP */}
          <nav className={`hidden md:block sticky top-0 z-10 shadow-sm border-b ${
            highContrast ? 'bg-zinc-900 border-yellow-300 text-yellow-300' : 'bg-[#9A5071] text-[#E6D8CB] border-[#9A5071]'
          }`}>
            <div className="max-w-5xl mx-auto px-4 flex justify-center gap-6">
              {menuItems.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => {
                    setActiveTab(tab.id);
                    speak(`Sección ${tab.label}`);
                  }}
                  className={`flex items-center gap-2 py-3 px-6 text-sm font-bold border-b-4 transition-all ${
                    activeTab === tab.id 
                      ? (highContrast ? 'border-yellow-300 bg-black text-yellow-300' : 'border-[#F1BBBB] bg-[#2F3559] text-white')
                      : 'border-transparent hover:bg-black/10'
                  }`}
                >
                  {tab.icon}
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-grow max-w-4xl mx-auto w-full px-4 py-6 overflow-y-auto">
            {activeTab === 'home' && (
              <HomeScreen setActiveTab={setActiveTab} speak={speak} highContrast={highContrast} />
            )}
            
            {activeTab === 'braille' && (
              <BrailleScreen speak={speak} highContrast={highContrast} />
            )}
            
            {activeTab === 'cuentos' && (
              <StoriesScreen 
                speak={speak} 
                stories={stories} 
                setStories={setStories} 
                highContrast={highContrast} 
              />
            )}
          </main>

          {/* MENÚ NAVEGACIÓN MÓVIL */}
          <nav className={`md:hidden fixed bottom-0 left-0 right-0 z-30 border-t flex items-center justify-around py-2 px-3 shadow-2xl backdrop-blur-md ${
            highContrast ? 'bg-black border-yellow-300 text-yellow-300' : 'bg-[#2F3559] text-[#E6D8CB] border-[#9A5071]/30'
          }`}>
            {menuItems.map(item => (
              <button
                key={item.id}
                onClick={() => {
                  setActiveTab(item.id);
                  speak(item.label);
                }}
                className={`flex flex-col items-center justify-center p-2 rounded-2xl w-20 transition-all ${
                  activeTab === item.id 
                    ? (highContrast ? 'bg-yellow-300 text-black font-extrabold' : 'bg-[#9A5071] text-white font-extrabold shadow-md')
                    : 'opacity-70 hover:opacity-100'
                }`}
              >
                <div className="mb-1">{item.icon}</div>
                <span className="text-[11px] leading-none">{item.label}</span>
              </button>
            ))}
          </nav>

        </div>
      );
    }

    function HomeScreen({ setActiveTab, speak, highContrast }) {
      return (
        <div className="space-y-6 animate-fadeIn max-w-2xl mx-auto">
          
          <div className={`p-6 md:p-8 rounded-3xl shadow-lg border text-center transition-all ${
            highContrast ? 'bg-black border-yellow-300 text-yellow-300' : 'bg-white border-[#E394A7]/20 text-[#2F3559]'
          }`}>
            <div className="inline-flex p-3 bg-[#E6D8CB]/60 rounded-full mb-4 shadow-sm">
              <span className="text-4xl md:text-5xl" role="img" aria-label="Perrito Guía">🦮</span>
            </div>
            <h2 className="text-2xl md:text-3xl font-black mb-3">¡Bienvenido a Braille Voz!</h2>
            <p className="text-xs md:text-sm leading-relaxed mb-6 max-w-md mx-auto opacity-90 font-medium">
              Aprende el alfabeto Braille jugando y explora nuestra biblioteca de cuentos sensoriales narrados, diseñados para estimular el oído, el tacto y la imaginación.
            </p>
            
            <button
              onClick={() => speak("Braille Voz es un entorno accesible interactivo para niños y adultos. Puedes aprender el alfabeto en código Braille o disfrutar de cuentos narrados llenos de detalles sensoriales.")}
              className={`px-6 py-3 rounded-full font-bold text-xs md:text-sm inline-flex items-center gap-2 shadow-md hover:scale-105 transition-all ${
                highContrast ? 'bg-yellow-300 text-black hover:bg-yellow-400' : 'bg-[#2F3559] text-[#E6D8CB] hover:bg-[#2F3559]/90'
              }`}
            >
              <Icon name="Volume2" size={18} />
              <span>Escuchar presentación</span>
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {[
              { id: 'braille', label: 'Abecedario Braille', desc: 'Explora puntos, traduce textos y construye letras.', icon: <Icon name="BookOpen" size={22} />, bg: 'bg-[#F1BBBB]/30' },
              { id: 'cuentos', label: 'Biblioteca de Cuentos', desc: 'Escucha cuentos llenos de experiencias táctiles y auditivas.', icon: <Icon name="Sparkles" size={22} />, bg: 'bg-[#E394A7]/30' }
            ].map(item => (
              <button
                key={item.id}
                onClick={() => { setActiveTab(item.id); speak(`Ir a ${item.label}`); }}
                className={`p-5 rounded-2xl border flex items-center gap-4 text-left transition-all hover:scale-[1.02] shadow-sm ${
                  highContrast ? 'bg-zinc-950 border-yellow-300 text-yellow-300' : 'bg-white border-gray-200/80 hover:border-[#9A5071]'
                }`}
              >
                <div className={`p-3.5 rounded-2xl ${highContrast ? 'bg-yellow-300 text-black' : `${item.bg} text-[#2F3559]`}`}>
                  {item.icon}
                </div>
                <div>
                  <h3 className="text-sm md:text-base font-extrabold block">{item.label}</h3>
                  <p className="text-xs opacity-75 mt-0.5 leading-snug">{item.desc}</p>
                </div>
              </button>
            ))}
          </div>

        </div>
      );
    }

    function BrailleScreen({ speak, highContrast }) {
      const [subTab, setSubTab] = useState('explorar');
      const [customCell, setCustomCell] = useState([]);
      const [searchText, setSearchText] = useState('');

      const toggleDot = (dot) => {
        let newCell = customCell.includes(dot) 
          ? customCell.filter(d => d !== dot)
          : [...customCell, dot].sort();
        
        setCustomCell(newCell);

        const matched = Object.keys(BRAILLE_ALPHABET).find(letter => {
          const dots = BRAILLE_ALPHABET[letter];
          return dots.length === newCell.length && dots.every(v => newCell.includes(v));
        });

        if (matched) {
          playTone(440, 0.2);
          speak(`Has formado la letra ${matched.toUpperCase()}`);
        } else {
          playTone(300, 0.1);
        }
      };

      const getCustomLetter = () => {
        return Object.keys(BRAILLE_ALPHABET).find(letter => {
          const dots = BRAILLE_ALPHABET[letter];
          return dots.length === customCell.length && dots.every(v => customCell.includes(v));
        }) || null;
      };

      return (
        <div className="space-y-5 animate-fadeIn max-w-2xl mx-auto">
          
          <div className={`flex p-1.5 rounded-2xl border ${
            highContrast ? 'bg-zinc-900 border-yellow-300/40' : 'bg-black/5 border-black/5'
          }`}>
            {[
              { id: 'explorar', label: 'Explorar' },
              { id: 'constructor', label: 'Constructor' },
              { id: 'traductor', label: 'Traductor' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => { setSubTab(tab.id); speak(`Herramienta ${tab.label}`); }}
                className={`flex-1 py-2 text-xs md:text-sm font-extrabold rounded-xl transition-all ${
                  subTab === tab.id 
                    ? (highContrast ? 'bg-yellow-300 text-black shadow-sm' : 'bg-white shadow-sm text-[#9A5071]') 
                    : 'opacity-70 hover:opacity-100'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {subTab === 'explorar' && (
            <div className={`p-5 rounded-2xl border shadow-sm ${
              highContrast ? 'bg-black border-yellow-300' : 'bg-white border-gray-200'
            }`}>
              <p className="text-xs mb-4 text-center opacity-85 font-semibold">Toca cualquier letra para escuchar su pronunciación y conocer sus puntos Braille.</p>
              <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 max-h-[50vh] overflow-y-auto pr-1">
                {Object.entries(BRAILLE_ALPHABET).map(([letter, dots]) => (
                  <button
                    key={letter}
                    onClick={() => {
                      playTone(320 + (letter.charCodeAt(0) * 3), 0.15);
                      speak(`Letra ${letter.toUpperCase()}. Puntos: ${dots.join(', ')}`);
                    }}
                    className={`p-3 rounded-xl border flex flex-col items-center justify-center transition-all hover:scale-105 ${
                      highContrast ? 'bg-zinc-900 border-yellow-300/30 text-yellow-300' : 'bg-gray-50 border-gray-200 hover:border-[#9A5071]'
                    }`}
                  >
                    <span className="text-lg font-black mb-1.5">{letter.toUpperCase()}</span>
                    <div className="grid grid-cols-2 gap-1 bg-black/5 p-1.5 rounded-lg">
                      {[1, 4, 2, 5, 3, 6].map(d => (
                        <div 
                          key={d} 
                          className={`w-2.5 h-2.5 rounded-full ${
                            dots.includes(d) ? (highContrast ? 'bg-yellow-300' : 'bg-[#9A5071]') : 'bg-gray-300/60'
                          }`} 
                        />
                      ))}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {subTab === 'constructor' && (
            <div className={`p-6 rounded-2xl border shadow-sm flex flex-col sm:flex-row items-center gap-6 ${
              highContrast ? 'bg-black border-yellow-300' : 'bg-white border-gray-200'
            }`}>
              <div className="flex-1 text-center sm:text-left space-y-3">
                <h3 className="text-base font-black flex items-center gap-2 justify-center sm:justify-start">
                  <Icon name="Sparkles" size={18} className="text-[#9A5071]" /> Constructor Táctil
                </h3>
                <p className="text-xs opacity-80 leading-relaxed">Selecciona los puntos de la celda de 6 puntos para armar una letra.</p>
                
                <div className="pt-2 flex items-center justify-center sm:justify-start gap-3">
                  <span className="text-xs uppercase font-extrabold opacity-70">Resultado:</span>
                  <span className="text-3xl font-black text-[#9A5071] bg-[#E6D8CB]/40 px-4 py-1.5 rounded-xl border border-[#9A5071]/20">
                    {getCustomLetter() ? getCustomLetter().toUpperCase() : '?'}
                  </span>
                </div>

                <button
                  onClick={() => { setCustomCell([]); speak("Celda limpia"); }}
                  className="mt-2 px-4 py-2 rounded-xl border text-xs font-bold uppercase tracking-wider bg-black/5 hover:bg-black/10 transition-colors"
                >
                  Limpiar celda
                </button>
              </div>

              <div className="p-4 bg-[#E6D8CB]/30 rounded-2xl border border-[#9A5071]/20">
                <div className="grid grid-cols-2 gap-3">
                  {[1, 4, 2, 5, 3, 6].map(num => (
                    <button
                      key={num}
                      onClick={() => toggleDot(num)}
                      className={`w-14 h-14 rounded-full font-black text-base flex items-center justify-center transition-all shadow-sm ${
                        customCell.includes(num)
                          ? (highContrast ? 'bg-yellow-300 text-black scale-105' : 'bg-[#9A5071] text-white scale-105')
                          : 'bg-white border-2 border-gray-300 hover:border-[#9A5071]'
                      }`}
                    >
                      {num}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {subTab === 'traductor' && (
            <div className={`p-5 rounded-2xl border shadow-sm space-y-4 ${
              highContrast ? 'bg-black border-yellow-300' : 'bg-white border-gray-200'
            }`}>
              <div className="flex items-center gap-2">
                <Icon name="Search" size={18} className="text-[#9A5071]" />
                <h3 className="text-sm font-black">Traductor a Braille</h3>
              </div>
              
              <input 
                type="text" 
                value={searchText}
                onChange={(e) => setSearchText(e.target.value)}
                placeholder="Escribe palabras o frases aquí..."
                className={`w-full p-3 rounded-xl font-bold text-sm focus:outline-none focus:ring-2 ${
                  highContrast 
                    ? 'bg-zinc-900 border border-yellow-300 text-yellow-300 focus:ring-yellow-300' 
                    : 'bg-[#E6D8CB]/20 border border-gray-300 focus:ring-[#9A5071] text-[#2F3559]'
                }`}
              />

              {searchText && (
                <div className="p-4 bg-[#E6D8CB]/15 rounded-xl max-h-[35vh] overflow-y-auto border border-gray-200/50">
                  <div className="flex flex-wrap gap-2.5">
                    {searchText.toLowerCase().split('').map((char, index) => {
                      const activeDots = BRAILLE_ALPHABET[char] || [];
                      if (!BRAILLE_ALPHABET[char] && char !== ' ') return null;
                      return (
                        <div key={index} className="flex flex-col items-center p-2.5 bg-white rounded-xl border border-gray-200 text-xs min-w-[52px] shadow-sm">
                          <span className="font-extrabold mb-1.5 text-xs text-[#2F3559]">{char === ' ' ? 'Esp' : char.toUpperCase()}</span>
                          <div className="grid grid-cols-2 gap-1 bg-[#E6D8CB]/30 p-1 rounded-md">
                            {[1, 4, 2, 5, 3, 6].map(dot => (
                              <div 
                                key={dot}
                                className={`w-2 h-2 rounded-full ${
                                  activeDots.includes(dot) ? 'bg-[#9A5071]' : 'bg-gray-300'
                                }`}
                              />
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    function StoriesScreen({ speak, stories, setStories, highContrast }) {
      const [selectedStory, setSelectedStory] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);

      const playStory = (story) => {
        setSelectedStory(story);
        setIsPlaying(true);
        speak(`Título: ${story.title}. Enfoque sensorial: ${story.sensoryFocus}. ... ${story.content}`);
      };

      const pauseStory = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.pause();
        setIsPlaying(false);
        speak("Lectura pausada");
      };

      const resumeStory = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.resume();
        setIsPlaying(true);
      };

      const stopStory = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsPlaying(false);
        setSelectedStory(null);
      };

      return (
        <div className="space-y-5 animate-fadeIn max-w-2xl mx-auto">
          
          {selectedStory ? (
            <div className={`p-6 rounded-3xl border shadow-lg space-y-5 ${
              highContrast ? 'bg-black border-yellow-300 text-yellow-300' : 'bg-white border-gray-200 text-[#2F3559]'
            }`}>
              <div className="flex items-start justify-between border-b pb-3 gap-3">
                <div>
                  <span className="text-[10px] font-black uppercase tracking-wider bg-[#9A5071] text-white px-2.5 py-1 rounded-md">
                    {selectedStory.sensoryFocus}
                  </span>
                  <h3 className="text-xl md:text-2xl font-black mt-2 leading-tight">{selectedStory.title}</h3>
                </div>
                <button 
                  onClick={stopStory}
                  className="p-2 border rounded-full hover:bg-gray-100 transition-colors"
                  title="Volver a la biblioteca"
                >
                  <Icon name="ArrowLeft" size={18} />
                </button>
              </div>

              <div className="max-h-[42vh] overflow-y-auto pr-2 text-sm md:text-base leading-relaxed whitespace-pre-line bg-[#E6D8CB]/20 p-4 rounded-2xl border border-gray-200 font-medium">
                {selectedStory.content}
              </div>

              <div className="flex flex-wrap gap-3 justify-center pt-1">
                {isPlaying ? (
                  <button
                    onClick={pauseStory}
                    className="px-5 py-2.5 bg-[#9A5071] text-white text-xs md:text-sm rounded-full flex items-center gap-2 font-extrabold shadow-md hover:bg-[#9A5071]/90"
                  >
                    <Icon name="Pause" size={16} /> Pausar
                  </button>
                ) : (
                  <button
                    onClick={resumeStory}
                    className="px-5 py-2.5 bg-[#2F3559] text-white text-xs md:text-sm rounded-full flex items-center gap-2 font-extrabold shadow-md hover:bg-[#2F3559]/90"
                  >
                    <Icon name="Play" size={16} /> Reanudar
                  </button>
                )}
                <button
                  onClick={() => playStory(selectedStory)}
                  className="px-5 py-2.5 border border-gray-300 text-xs md:text-sm rounded-full flex items-center gap-2 font-bold hover:bg-gray-100 transition-colors"
                >
                  <Icon name="RotateCcw" size={16} /> Reiniciar
                </button>
              </div>
            </div>
          ) : (
            <div className="space-y-4">
              <div className="flex items-center justify-between px-1">
                <h3 className="text-base font-black flex items-center gap-2">
                  <Icon name="BookOpen" size={18} className="text-[#9A5071]" /> Biblioteca de Cuentos ({stories.length})
                </h3>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto pr-1">
                {stories.map(story => (
                  <div
                    key={story.id}
                    className={`p-4 rounded-2xl border flex flex-col justify-between shadow-sm hover:shadow-md transition-all ${
                      highContrast ? 'bg-zinc-950 border-yellow-300' : 'bg-white border-gray-200'
                    }`}
                  >
                    <div>
                      <span className="text-[10px] font-extrabold text-[#9A5071] uppercase bg-[#E6D8CB]/40 px-2 py-0.5 rounded-md">
                        {story.sensoryFocus}
                      </span>
                      <h4 className="text-base font-black mt-2 mb-1.5 leading-snug">{story.title}</h4>
                      <p className="text-xs opacity-80 line-clamp-2 leading-relaxed mb-4">{story.summary}</p>
                    </div>
                    <button
                      onClick={() => playStory(story)}
                      className="w-full py-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 bg-[#2F3559] text-white hover:bg-[#2F3559]/90 transition-colors shadow-sm"
                    >
                      <Icon name="Play" size={14} /> Escuchar Cuento
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
